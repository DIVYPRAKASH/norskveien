<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norskveien</title>
<meta name="description" content="Learn Norwegian from A2 to B2: grammar, pronunciation, reading, speaking, writing and everyday life in Norway.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one calm centered column; the level route is the only "drawn" element. Flag blue for action, flag red only as a small marker. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#101A2B; --muted:#5D6779; --line:#E2E6EC; --soft:#EEF1F6;
  --primary:#00205B; --primary-fg:#FFFFFF; --accent:#C8102E;
  --good:#1D7A4B; --good-soft:#E3F3EA; --bad:#B24E17; --bad-soft:#FBEDE3;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#161C25; --ink:#E8ECF2; --muted:#909BAB; --line:#263041; --soft:#1C2430;
  --primary:#9DBBFF; --primary-fg:#0E1218; --accent:#FF5C70;
  --good:#52C68E; --good-soft:#15291F; --bad:#F0A060; --bad-soft:#2D2015; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161C25; --ink:#E8ECF2; --muted:#909BAB; --line:#263041; --soft:#1C2430;
  --primary:#9DBBFF; --primary-fg:#0E1218; --accent:#FF5C70;
  --good:#52C68E; --good-soft:#15291F; --bad:#F0A060; --bad-soft:#2D2015; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px)} h2{font-size:24px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.flag{width:22px;height:16px;border-radius:3px;background:linear-gradient(90deg,transparent 30%,var(--primary) 30%,var(--primary) 42%,transparent 42%),linear-gradient(0deg,transparent 40%,var(--primary) 40%,var(--primary) 60%,transparent 60%),var(--accent);position:relative}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:11px 20px;border:1px solid transparent;cursor:pointer;background:var(--primary);color:var(--primary-fg);transition:transform .08s ease,opacity .15s}
.btn:active{transform:scale(.98)} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.link{background:none;border:0;color:var(--muted);padding:6px 8px;font-weight:500}
.btn.link:hover{color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:14px}
.acct{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;cursor:pointer;max-width:260px}
.acct:hover{color:var(--ink)}
.acct-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--line);margin-left:4px;flex:none}
.sdot.error{background:var(--bad)}.sdot.ok{background:var(--good)}
.top .row{flex-wrap:nowrap}
@media (max-width:560px){.acct{max-width:130px}.acct .acct-t.long{display:none}.acct{padding:6px}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
/* choice cards */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--primary)}
.choice .code{font-family:var(--display);font-weight:700;font-size:22px}
.choice.alt{background:var(--soft);border-style:dashed}
/* route */
.route{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:8px 0 4px}
.route::before{content:"";position:absolute;left:12.5%;right:12.5%;top:17px;height:2px;background:var(--line)}
.route .fill{position:absolute;left:12.5%;top:17px;height:2px;background:var(--primary)}
.stn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0 2px}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted)}
.stn.have .dot,.stn.done .dot{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.stn.now .dot{border-color:var(--primary);color:var(--ink);box-shadow:0 0 0 4px var(--soft)}
.stn.now .dot::after{content:"";position:absolute;top:-2px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.stn.off{opacity:.45}
.stn .lbl{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.stn.sel .lbl{color:var(--ink);font-weight:600}
/* today */
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.task{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--soft);cursor:pointer;border:1px solid transparent;font:inherit;color:inherit;text-align:left;width:100%}
.task:hover{border-color:var(--line)}
.task .ix{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:700;font-size:14px;font-family:var(--display)}
.task.main{background:var(--primary);color:var(--primary-fg)}
.task.main .ix{background:var(--primary-fg);color:var(--primary)}
.task.main .muted{color:inherit;opacity:.8}
.task .tx{min-width:0;flex:1}
.task .go{flex:none;font-size:20px;opacity:.7}
/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.skill .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pct{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.lessonbtn{display:flex;justify-content:space-between;gap:8px;align-items:center;font:inherit;font-size:14px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0 0;color:inherit;cursor:pointer}
.lessonbtn:hover .lt{text-decoration:underline}
.lessonbtn .st{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lessonbtn .st.ok{color:var(--good);font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.now{background:var(--primary);color:var(--primary-fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* lesson */
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.progress>i{display:block;height:100%;background:var(--primary);transition:width .3s}
.lessonhd{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:66ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.no{font-weight:600;color:var(--primary)}
.t{border-collapse:collapse;width:100%;font-size:15px}
.t th,.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.t th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.passage{background:var(--soft);border-radius:var(--r);padding:18px 20px;white-space:pre-line;font-size:16px;line-height:1.7;max-width:66ch}
details.passage summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.q{font-size:clamp(20px,3.4vw,24px);font-family:var(--display);font-weight:600;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display)}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.inp{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
textarea.inp{min-height:200px;resize:vertical;line-height:1.6;font-size:16px}
.keys{display:flex;gap:6px}
.key{font:inherit;font-weight:600;width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:12px}
.tiles.ans{border:1px dashed var(--line);background:var(--surface)}
.tile{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
.tiles.ans .tile{background:var(--soft)}
.play{display:inline-flex;align-items:center;gap:8px}
.say{font-family:var(--display);font-size:clamp(22px,4vw,28px);font-weight:600;line-height:1.3;color:var(--primary)}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.model{white-space:pre-line;background:var(--soft);border-radius:12px;padding:16px;font-size:15px}
.notice{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--muted)}
.score{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:20px}.card,.today{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Course content. Convention: in mc/listen items the FIRST option is the correct one (options are shuffled on screen).
const mc=(q,o,x)=>({t:"mc",q,o,x});
const fl=(q,a,x)=>({t:"fill",q,a:[].concat(a),x});
const od=(q,w,x,alt)=>({t:"order",q,w,x,alt:alt||[]});
const ls=(say,o,x)=>({t:"listen",say,o,x});
const sp=(say,en,tip)=>({t:"speak",say,en,tip});
const wr=(q,min,hints,model)=>({t:"write",q,min,hints,model});

const LEVEL_INFO={
  A1:{nb:"Nybegynner",en:"Beginner",can:"You know basic words and phrases and can introduce yourself."},
  A2:{nb:"Grunnleggende",en:"Elementary",can:"Handle everyday situations: shopping, directions, talking about your week and what you did."},
  B1:{nb:"Mellomnivå",en:"Intermediate",can:"Give opinions, write emails, follow everyday conversations and work life in Norway."},
  B2:{nb:"Høyere mellomnivå",en:"Upper intermediate",can:"Discuss and argue, read news, write structured texts and understand different dialects."}
};

const SKILLS=[
  {id:"gram",nb:"Grammatikk",en:"Grammar"},
  {id:"uttale",nb:"Uttale",en:"Pronunciation"},
  {id:"lese",nb:"Lesing",en:"Reading"},
  {id:"snakke",nb:"Muntlig",en:"Speaking"},
  {id:"skrive",nb:"Skriving",en:"Writing"},
  {id:"kultur",nb:"Norge i praksis",en:"How it's used in Norway"}
];

const COURSE={
/* ================= A2 ================= */
A2:{
gram:[
{title:"Fortid og ordstilling",en:"Past tense and word order",
intro:`<p>Use <b>preteritum</b> for finished events: <i>i går, i fjor, forrige uke</i>.</p>
<table class="t"><tr><th>Group</th><th>Infinitive</th><th>Past</th></tr>
<tr><td>-et</td><td>å snakke, å jobbe</td><td>snakket, jobbet</td></tr>
<tr><td>-te</td><td>å spise, å kjøpe</td><td>spiste, kjøpte</td></tr>
<tr><td>-de</td><td>å prøve, å leve</td><td>prøvde, levde</td></tr>
<tr><td>-dde</td><td>å bo, å tro</td><td>bodde, trodde</td></tr>
<tr><td>strong</td><td>gå, se, drikke, komme, være, ha</td><td>gikk, så, drakk, kom, var, hadde</td></tr></table>
<p><b>The V2 rule:</b> the verb is always the second element. Start with a time or place and the subject moves behind the verb: <span class="no">I går <b>spiste</b> jeg fisk.</span></p>
<p><b>ikke</b> comes right after the verb in a main clause: <span class="no">Jeg liker <b>ikke</b> kaffe.</span></p>`,
ex:[
fl("I går ___ jeg pizza. (spise)","spiste","-te group: spise → spiste."),
fl("Vi ___ på kino på lørdag. (gå)","gikk","Strong verb: gå → gikk."),
fl("Hun ___ i Trondheim før. (bo)","bodde","-dde group: bo → bodde."),
mc("Choose the correct sentence.",["I dag spiser jeg fisk.","I dag jeg spiser fisk.","I dag fisk jeg spiser."],"V2: the verb comes second, right after “I dag”."),
mc("Where does “ikke” go?",["Jeg liker ikke kaffe.","Jeg ikke liker kaffe.","Ikke jeg liker kaffe."],"In a main clause, ikke comes right after the verb."),
od("Build: Tomorrow we travel to Tromsø.",["I morgen","reiser","vi","til","Tromsø"],"Time first, then the verb, then the subject.",["Vi reiser til Tromsø i morgen"])
]},
{title:"Perfektum og framtid",en:"Present perfect and future",
intro:`<p><b>Perfektum</b> = <i>har</i> + past participle. Use it for experiences and things that still matter now, often with <i>aldri, noen gang, i to år</i>.</p>
<table class="t"><tr><th>Infinitive</th><th>Perfect</th></tr>
<tr><td>å snakke / å spise / å bo</td><td>har snakket / har spist / har bodd</td></tr>
<tr><td>å gå / å se / å være</td><td>har gått / har sett / har vært</td></tr>
<tr><td>å lese / å skrive / å ha</td><td>har lest / har skrevet / har hatt</td></tr></table>
<p><b>Future:</b> <span class="no">Jeg <b>skal</b> reise.</span> (plan) · <span class="no">Det <b>kommer til å</b> regne.</span> (prediction) · <span class="no">I morgen <b>reiser</b> jeg.</span> (present + time word)</p>`,
ex:[
fl("Jeg har ___ her i to år. (bo)","bodd","bo → bodde → har bodd."),
mc("“I have never been to Tromsø.”",["Jeg har aldri vært i Tromsø.","Jeg var aldri i Tromsø.","Jeg har aldri være i Tromsø."],"A life experience uses perfektum: har + vært."),
fl("Har du ___ boka? (lese)","lest","lese → leste → har lest."),
mc("“Det kommer til å regne i morgen.” What does it express?",["A prediction","A plan you have made","Something that happened"],"Kommer til å predicts. Use skal for plans."),
fl("Vi ___ reise til Spania i sommer – vi har kjøpt billetter.","skal","A plan or arrangement uses skal."),
od("Build: I have not eaten breakfast.",["Jeg","har","ikke","spist","frokost"],"ikke comes after the first verb (har).")
]}
],
uttale:[
{title:"Kj, sj og stumme bokstaver",en:"Kj, sj and silent letters",
intro:`<p><b>Kj-sound</b> (soft, like German <i>ich</i>): kj, and k before i / y / ei / øy: <span class="no">kjøre, kino, kylling</span>.</p>
<p><b>Sj-sound</b> (like English “sh”): sj, skj, and sk before i / y / ei / øy: <span class="no">sjø, skje, ski, sky</span>.</p>
<p><b>Silent letters:</b></p><ul>
<li><b>hv-</b> → v: <span class="no">hva, hvor</span></li>
<li><b>hj- / gj-</b> → j: <span class="no">hjem, gjøre</span></li>
<li><b>-d</b> after a vowel is often silent: <span class="no">god, glad, ved</span></li>
<li><b>-ig</b> drops the g: <span class="no">hyggelig, viktig</span></li>
<li><span class="no">jeg</span> sounds like “jæi”, <span class="no">meg / deg</span> like “mæi / dæi”</li></ul>`,
ex:[
mc("Which word starts with the “sh” sound?",["ski","kake","kopp"],"sk before i sounds like “sh”."),
mc("How do you pronounce “hvor”?",["Like “vor”, the h is silent","With a strong h","Like “for”"],"hv- = v. Same in hva, hvem, hvorfor."),
mc("In “hyggelig”, the final g is…",["silent","hard, like in “go”","like “j”"],"-ig endings drop the g: hyggelig, viktig, deilig."),
ls("ski",["ski","si","sky"],"ski starts with the sh-sound."),
ls("kino",["kino","Kina","kone"],"kino = cinema, Kina = China."),
sp("Skal vi kjøre til sjøen?","Shall we drive to the sea?","Soft kj in kjøre, “sh” in sjøen."),
sp("Hyggelig å hilse på deg.","Nice to meet you.","Silent g in hyggelig, “dæi” for deg.")
]},
{title:"Lange og korte vokaler",en:"Long and short vowels",
intro:`<p>Every stressed vowel is either long or short, and it can change the meaning.</p>
<table class="t"><tr><th>Short (double consonant)</th><th>Long</th></tr>
<tr><td>takk (thanks)</td><td>tak (roof)</td></tr>
<tr><td>hatt (hat)</td><td>hat (hate)</td></tr>
<tr><td>vann (water)</td><td>van (used to)</td></tr></table>
<p>Norwegian has nine vowels: <b>a e i o u y æ ø å</b>. Long <b>o</b> is close to English “oo” (<span class="no">bok, sol</span>). <b>y</b> is an “i” with rounded lips (<span class="no">by</span>).</p>`,
ex:[
mc("Which word has a short vowel?",["takk","tak","tal"],"A double consonant after the vowel makes it short."),
ls("takk",["takk","tak"],"takk: short a."),
ls("by",["by","bi"],"by = city (rounded lips), bi = bee."),
ls("hus",["hus","hos"],"hus = house, hos = at someone's place."),
mc("How is “o” usually pronounced in “bok”?",["Like “oo” in “food”","Like “o” in “hot”","Like “ow” in “cow”"],"Norwegian long o is close to English “oo”."),
sp("Tusen takk for maten!","Thanks a lot for the food!","Short a in takk, long a in maten."),
sp("Det er fint vær i dag.","The weather is nice today.","Long æ in vær.")
]}
],
lese:[
{title:"En helg på hytta",en:"A weekend at the cabin",
text:`Forrige helg dro familien Hansen på hytta. Hytta ligger ved et vann, to timer fra Lillehammer. Det er ikke strøm der, så de brukte stearinlys og fyrte i peisen. På lørdag gikk de på ski, og på søndag fisket de på isen. Det var kaldt, minus femten grader, men alle syntes det var veldig koselig. Søndag kveld kjørte de hjem igjen. Det var mye trafikk, og de kom ikke hjem før klokka ti.`,
intro:`<p>Read the text. Try to understand the whole story before checking words. The text stays visible while you answer.</p><p>Useful: <span class="no">strøm</span> = electricity, <span class="no">peis</span> = fireplace, <span class="no">ikke … før</span> = not until.</p>`,
ex:[
mc("Where is the cabin?",["By a lake","By the sea","In Lillehammer town"],"“Hytta ligger ved et vann.”"),
mc("Why did they use candles?",["There is no electricity","It was Christmas","The lamps were broken"],"“Det er ikke strøm der.”"),
mc("What did they do on Sunday?",["Ice fishing","Skiing","Shopping"],"“På søndag fisket de på isen.”"),

{title:"Hverdagen i Norge",en:"Everyday life in Norway",
intro:`<p>Small things that make daily life in Norway easier to understand.</p><ul>
<li><b>Matpakke</b>: a packed lunch of open sandwiches, often in paper.</li>
<li><b>Brunost</b>: sweet brown cheese, on bread or waffles.</li>
<li><b>Vinmonopolet</b>: the state shop for wine and spirits. Supermarkets only sell beer, and not late in the evening.</li>
<li>Most shops are <b>closed on Sundays</b>.</li>
<li><b>Takk for maten</b> after a meal, <b>Takk for sist</b> when you meet someone you saw last time.</li></ul>`,
ex:[
mc("What is a “matpakke”?",["A packed lunch of open sandwiches","A takeaway meal","A box of groceries"],"Most Norwegians bring a matpakke to work and school."),
mc("Where do you buy a bottle of wine?",["Vinmonopolet","Any supermarket","A kiosk"],"Wine and spirits are sold only at Vinmonopolet."),
mc("You want to go grocery shopping on Sunday. What usually happens?",["Most shops are closed","Everything is open as normal","Shops open at noon"],"Only some small grocery shops are allowed to open."),
mc("When do you say “Takk for sist”?",["When you meet someone again after last time","When you leave a party","When someone gives you a gift"],"It thanks them for the last time you were together."),
mc("What is brunost?",["A sweet brown cheese","A type of bread","A fish dish"],"Try it on fresh waffles.")
]},

<li><b>Fellesferie</b>: July, when many workplaces close or slow down.</li>

gram:[
{title:"Adjektiver og dobbel bestemmelse",en:"Adjectives and double definiteness",
intro:`<p>Adjectives agree with the noun:</p>
<table class="t"><tr><th></th><th>en (m/f)</th><th>et (n)</th><th>plural / definite</th></tr>
<tr><td>stor</td><td>en stor bil</td><td>et stor<b>t</b> hus</td><td>store biler</td></tr>
<tr><td>liten</td><td>en liten bil</td><td>et lite hus</td><td>små biler</td></tr></table>
<p><b>Definite form</b> uses <i>den / det / de</i> + adjective with <b>-e</b> + noun with ending. This is called double definiteness:</p>
<p class="no">den store bilen · det store huset · de store bilene</p>`,
ex:[
fl("et ___ hus (stor)","stort","Neuter (et) adds -t."),
fl("den ___ bilen (rød)","røde","Definite form: adjective + -e."),
mc("“the new house”",["det nye huset","det nytt hus","nye huset"],"Double definiteness: det + nye + huset."),
fl("to ___ katter (liten)","små","liten is irregular: små in plural."),
mc("Hun har en ___ jakke.",["blå","blått","blåe"],"blå: en blå, et blått, blå (plural)."),
od("Build: The old car is red.",["Den","gamle","bilen","er","rød"],"den + gamle + bilen.")
]},
{title:"Leddsetninger og sin/hans",en:"Subordinate clauses and sin / hans",
intro:`<p>In a <b>subordinate clause</b> (after <i>at, fordi, når, hvis, som, om</i>) <b>ikke</b> and other adverbs go <b>before</b> the verb:</p>
<p class="no">Jeg vet at han <b>ikke kommer</b>. · Hun er sliten fordi hun <b>alltid jobber</b> sent.</p>
<p><b>sin / si / sitt / sine</b> refer back to the subject of the same clause. <b>hans / hennes</b> refer to someone else:</p>
<p class="no">Per tar bilen <b>sin</b>. (his own) · Per tar bilen <b>hans</b>. (another man's)</p>`,
ex:[
mc("Choose the correct sentence.",["Jeg sier at jeg ikke har tid.","Jeg sier at jeg har ikke tid.","Jeg sier at ikke jeg har tid."],"Subordinate clause: ikke before the verb."),
mc("Han blir hjemme fordi …",["han ikke føler seg bra","han føler seg ikke bra","ikke han føler seg bra"],"After fordi: ikke + verb."),
mc("Kari besøker moren ___ (her own mother).",["sin","hennes","seg"],"Refers back to the subject Kari, so sin."),
mc("Ola liker Kari, men han liker ikke broren ___ (Kari's brother).",["hennes","sin","sitt"],"Not the subject's own brother, so hennes."),
fl("Barna leker med lekene ___ (their own).","sine","Plural: sine."),
od("Build: I know that she often travels.",["Jeg","vet","at","hun","ofte","reiser"],"ofte goes before the verb in the at-clause.")
]}
],
uttale:[
{title:"Tonelag og trykk",en:"Pitch accent and stress",
intro:`<p>Norwegian is “sing-song” because of two <b>tonelag</b> (pitch accents). Some word pairs differ only in melody:</p>
<table class="t"><tr><th>Tone 1 (single fall)</th><th>Tone 2 (double, singing)</th></tr>
<tr><td>bønder (farmers)</td><td>bønner (beans)</td></tr>
<tr><td>tanken (the tank)</td><td>tanken (the thought)</td></tr></table>
<p>Most one-syllable words have tone 1, and most two-syllable native words have tone 2 (<span class="no">gate, jente, snakke</span>). Stress is usually on the <b>first syllable</b>, but many loanwords stress the last: <span class="no">universitet, butikk, restaurant</span>.</p>`,
ex:[
mc("Where is the stress in “jente”?",["First syllable: JEN-te","Second syllable: jen-TE","Both equally"],"Native words stress the first syllable."),
mc("Where is the stress in “universitet”?",["Last syllable: -TET","First syllable: U-","Middle: -VER-"],"Loanwords often stress the end."),
mc("What makes “bønder” and “bønner” sound different?",["The melody (tonelag)","Long vs short vowel","A silent letter"],"They are a classic tone 1 / tone 2 pair."),
mc("Most two-syllable native words like “gate” have…",["Tone 2","Tone 1","No tone"],"The singing melody is typical for words like jente, gate, kake."),
sp("Jenta går i gata med kaka.","The girl walks in the street with the cake.","Practise the tone 2 melody in each word."),
sp("Vi møtes ved butikken i morgen.","We meet at the shop tomorrow.","butikk: stress on -tikk.")
]},
{title:"Svake former og flyt",en:"Weak forms and flow",
intro:`<p>In normal speech, small words are reduced and glued together. Recognising this is the key to understanding real Norwegians.</p>
<ul><li><span class="no">jeg</span> → “je” / “jæ”, <span class="no">det</span> → “de”</li>
<li><span class="no">ikke</span> → “'kke”: <i>har ikke</i> → “har'ke”</li>
<li><span class="no">skal / vil</span> → “ska / vi”: <i>Skal vi gå?</i> → “ska'vi gå?”</li>
<li><span class="no">Hva er det?</span> → “va'e de?”</li></ul>`,
ex:[
mc("“Je ha'kke tid.” means…",["Jeg har ikke tid.","Jeg hadde tid.","Jeg har tid."],"ikke is reduced to 'kke."),
mc("“Ska'vi gå?” means…",["Skal vi gå?","Vil du gå?","Kan vi gå?"],"skal loses its l in speech."),
mc("“Va'e de?” means…",["Hva er det?","Hvor er det?","Hvem er det?"],"hva er det, glued together."),
ls("Jeg har ikke tid i dag.",["Jeg har ikke tid i dag.","Jeg hadde tid i dag.","Jeg har tid i dag."],"Listen for the short “'kke”."),
sp("Skal vi ta en kaffe etterpå?","Shall we grab a coffee afterwards?","Try saying “ska'vi”."),
sp("Jeg vet ikke hva det er.","I don't know what it is.","Glue it: “je veit'ke va de e”.")
]}
],

text:`Kjære beboere!

text:`Butikkmedarbeider – 60 % stilling

intro:`<p>Write about a tradition from your home country and compare it with Norway. Use comparing words:</p>

wr("Describe a holiday or tradition from your country and compare it with a Norwegian one.",70,["mens","i motsetning til","I Norge"],
`I India feirer vi Diwali, lysfesten, om høsten. Vi tenner lys og lamper, spiser søtsaker og besøker familie og venner. Mange kjøper også nye klær.

Norge er landet i verden med den høyeste andelen elbiler. I 2024 var nesten ni av ti nye personbiler som ble solgt, helelektriske. Forklaringen er først og fremst politisk: I mange år har elbiler vært fritatt for de store avgiftene som legges på bensin- og dieselbiler, og eierne har fått rabatt i bomringer og på ferger.

{title:"Språk i endring",en:"A changing language",
text:`Språket vårt endrer seg raskere enn før, hevder mange. Engelske ord som «deadline», «chill» og «nice» har for lengst funnet veien inn i dagligtalen, og på sosiale medier blander unge norsk og engelsk uten å blunke. Bekymrede røster advarer mot at norsk kan bli et «kjøkkenspråk» som bare brukes hjemme, mens viktige samtaler foregår på engelsk.

}

/* ---------- progress helpers ---------- */
const lid=(L,sk,n)=>`${L}-${sk}-${n}`;
const lessonsOf=(L,sk)=>COURSE[L][sk];
function skillPct(L,sk){const ls=lessonsOf(L,sk);return Math.round(ls.reduce((t,_,n)=>t+(S.lessons[lid(L,sk,n)]?.best||0),0)/ls.length)}
function levelPct(L){let t=0,c=0;SKILLS.forEach(s=>lessonsOf(L,s.id).forEach((_,n)=>{c++;t+=S.lessons[lid(L,s.id,n)]?.best||0}));c++;t+=S.tests[L]?.passed?100:0;return Math.round(t/c)}
function path(){const a=LEVELS.indexOf(S.current),b=LEVELS.indexOf(S.target);return LEVELS.slice(a+1,b+1)}
function working(){return path().find(L=>!S.tests[L]?.passed)||null}
function markDay(){const d=today();if(!S.days.includes(d))S.days.push(d)}
function streak(){let n=0,d=new Date();const has=x=>S.days.includes(x.toISOString().slice(0,10));if(!has(d))d.setDate(d.getDate()-1);while(has(d)){n++;d.setDate(d.getDate()-1)}return n}
function daysAgo(iso){if(!iso)return null;return Math.round((new Date(today())-new Date(iso))/864e5)}
const skillName=id=>SKILLS.find(s=>s.id===id);

/* ---------- today's focus ---------- */
function todayPlan(){
  const L=working(); if(!L) return null;
  const sk=SKILLS.map(s=>({s,pct:skillPct(L,s.id),last:S.skillLast[L+s.id]||""}));
  const allDone=sk.every(x=>lessonsOf(L,x.s.id).every((_,n)=>S.lessons[lid(L,x.s.id,n)]?.done));
  const tasks=[];
  if(allDone){
    tasks.push({kind:"test",L,title:`Ta nivåtesten for ${L}`,why:"You've finished every lesson at this level. Pass the test (70 %) to move on."});
  }else{
    sk.sort((a,b)=>a.pct-b.pct||(a.last<b.last?-1:a.last>b.last?1:0));
    const weak=sk[0];
    const ls=lessonsOf(L,weak.s.id);
    let n=ls.findIndex((_,i)=>!S.lessons[lid(L,weak.s.id,i)]?.done);
    if(n<0)n=ls.reduce((m,_,i)=>(S.lessons[lid(L,weak.s.id,i)].best<S.lessons[lid(L,weak.s.id,m)].best?i:m),0);
    const why=weak.pct===0?`${weak.s.en} is the area you haven't started yet.`:`${weak.s.en} is your weakest area at ${L} (${weak.pct} %).`;
    tasks.push({kind:"lesson",L,sk:weak.s.id,n,title:ls[n].title,sub:`${weak.s.nb} · ${ls[n].en}`,why});
    // second: a different skill not practised for the longest time
    const other=sk.slice(1).sort((a,b)=>(a.last<b.last?-1:a.last>b.last?1:0)||a.pct-b.pct).find(x=>lessonsOf(L,x.s.id).some((_,i)=>!S.lessons[lid(L,x.s.id,i)]?.done||S.lessons[lid(L,x.s.id,i)].best<80));
    if(other){const ol=lessonsOf(L,other.s.id);let m=ol.findIndex((_,i)=>!S.lessons[lid(L,other.s.id,i)]?.done);if(m<0)m=0;
      const d=daysAgo(other.last);
      tasks.push({kind:"lesson",L,sk:other.s.id,n:m,title:ol[m].title,sub:`${other.s.nb} · ${ol[m].en}`,why:d==null?"Keep all six areas moving.":`Not practised for ${d===0?"a few hours":d+" day"+(d>1?"s":"")}.`});}
  }
  // review: weakest finished lesson below 80 %
  const done=Object.entries(S.lessons).filter(([k,v])=>v.done&&v.best<80).sort((a,b)=>a[1].best-b[1].best);
  const rev=done.find(([k])=>!tasks.some(t=>t.kind==="lesson"&&lid(t.L,t.sk,t.n)===k));
  if(rev){const [L2,sk2,n2]=rev[0].split("-");const les=COURSE[L2][sk2][+n2];tasks.push({kind:"lesson",L:L2,sk:sk2,n:+n2,title:les.title,sub:`Repetisjon · ${skillName(sk2).nb} ${L2}`,why:`Your best score was ${rev[1].best} %. One more round makes it stick.`});}
  else tasks.push({kind:"quick",L,title:"Rask repetisjon",sub:"8 mixed questions · about 4 min",why:"Short mixed practice from what you've learned."});
  return tasks.slice(0,3);
}

/* ---------- lesson / test runner ---------- */
function prep(ex){const it=Object.assign({},ex);if(ex.t==="mc"||ex.t==="listen")it.opts=shuffle(ex.o.map((t,k)=>({t,ok:k===0})));if(ex.t==="order")it.bank=shuffle(ex.w.map((_,k)=>k)),it.picked=[];return it}
function startRun(kind,opts){
  let items,meta=opts;
  if(kind==="lesson"){const les=COURSE[opts.L][opts.sk][opts.n];items=les.ex.map(prep);meta=Object.assign({les},opts)}
  else{ // test or quick: auto-graded items, no reading-passage items
    const pool=[];(opts.levels).forEach(L=>SKILLS.forEach(s=>{if(s.id==="lese")return;lessonsOf(L,s.id).forEach((les,n)=>{if(kind==="quick"&&opts.onlyDone&&!S.lessons[lid(L,s.id,n)]?.done)return;les.ex.forEach(e=>{if(["mc","fill","order","listen"].includes(e.t))pool.push(e)})})}));
    items=shuffle(pool).slice(0,kind==="test"?12:8).map(prep);
  }
  V={view:"run",kind,meta,items,i:0,phase:kind==="lesson"?"intro":"ex",res:[],answered:false,level:V.level};
  render();
}
function exHTML(it){
  const done=V.answered,r=V.res[V.i];
  let body="";
  if(it.t==="mc"||it.t==="listen"){
    body=(it.t==="listen"?`<p class="q">Hvilket hører du?</p>${voiceNote()}${playBtns(it.say)}`:`<p class="q">${esc(it.q)}</p>`)+
    `<div class="opts">${it.opts.map((o,k)=>`<button class="opt ${done&&o.ok?"right":""} ${done&&V.pick===k&&!o.ok?"wrong":""}" data-a="pick" data-v="${k}" ${done?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>`;
  }else if(it.t==="fill"){
    body=`<p class="q">${esc(it.q).replace("___",'<span style="color:var(--muted)">_____</span>')}</p>
    <div class="stack" style="gap:8px"><input class="inp" id="fillIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Skriv svaret" ${done?"disabled":""} value="${esc(V.typed||"")}">
    ${done?"":`<div class="row" style="justify-content:space-between"><div class="keys">${["æ","ø","å"].map(c=>`<button class="key" data-a="key" data-v="${c}">${c}</button>`).join("")}</div><button class="btn" data-a="checkFill">Sjekk</button></div>`}</div>`;
  }else if(it.t==="order"){
    body=`<p class="q">${esc(it.q)}</p>
    <div class="tiles ans" aria-label="Your sentence">${it.picked.map((k,j)=>`<button class="tile" data-a="unpick" data-v="${j}" ${done?"disabled":""}>${esc(it.w[k])}</button>`).join("")||'<span class="small muted" style="padding:8px">Tap the words in order</span>'}</div>
    <div class="tiles">${it.bank.map((k,j)=>`<button class="tile" data-a="tile" data-v="${j}" ${done?"disabled":""}>${esc(it.w[k])}</button>`).join("")}</div>
    ${done?"":`<div class="row" style="justify-content:flex-end"><button class="btn link" data-a="resetOrder">Nullstill</button><button class="btn" data-a="checkOrder" ${it.bank.length?"disabled":""}>Sjekk</button></div>`}`;
  }else if(it.t==="speak"){
    body=`<p class="eyebrow">Si det høyt</p><p class="say">${esc(it.say)}</p><p class="muted">${esc(it.en)}</p>${voiceNote()}${playBtns(it.say)}
    ${it.tip?`<p class="notice">${esc(it.tip)}</p>`:""}
    <p class="small muted">Listen, then say it aloud three times. How did it go?</p>
    ${done?"":`<div class="row"><button class="btn" data-a="self" data-v="1">Jeg fikk det til</button><button class="btn ghost" data-a="self" data-v="0">Må øve mer</button></div>`}`;
  }else if(it.t==="write"){
    body=`<p class="eyebrow">Skriv</p><p class="q">${esc(it.q)}</p>
    <div class="row" style="gap:6px">${it.hints.map(h=>`<span class="chip" data-hint="${esc(h)}">${esc(h)}</span>`).join("")}</div>
    <textarea class="inp" id="writeIn" placeholder="Skriv her …" ${done?"disabled":""}>${esc(V.typed||"")}</textarea>
    <div class="row" style="justify-content:space-between"><span class="small muted" id="wc">0 / ${it.min} words</span>${done?"":`<button class="btn" data-a="checkWrite" id="wsub" disabled>Lever</button>`}</div>
    ${done?`<div class="stack" style="gap:8px"><p class="eyebrow">Eksempelsvar</p><div class="model">${esc(it.model)}</div><p class="small muted">Compare with your text. Did you use the structure and the key phrases? Read the model aloud for extra speaking practice.</p>${playBtns(it.model)}</div>`:""}`;
  }
  let fb="";
  if(done&&it.t!=="speak"&&it.t!=="write"){
    const right=it.t==="mc"||it.t==="listen"?it.opts.find(o=>o.ok).t:it.t==="fill"?it.a[0]:it.w.join(" ");
    fb=`<div class="fb ${r?"ok":"no"}"><b>${r?"Riktig!":"Ikke helt"}</b>${r?"":`<span>Answer: <b style="font-family:inherit;color:inherit">${esc(right)}</b></span>`}${it.x?`<span class="small">${esc(it.x)}</span>`:""}</div>`;
  }else if(done&&it.t==="write"){fb=`<div class="fb ${r?"ok":"no"}"><b>${r?"Levert":"Levert – litt kort"}</b><span class="small">${r?"Good length and you used the key phrases.":"Try to reach the word count and use at least half of the key phrases next time."}</span></div>`}
  return body+fb+(done?`<div class="row" style="justify-content:flex-end"><button class="btn" data-a="next" id="nextBtn">${V.i+1<V.items.length?"Neste":"Se resultat"}</button></div>`:"");
}
function vRun(){
  const m=V.meta,kind=V.kind;
  const label=kind==="lesson"?`${m.L} · ${skillName(m.sk).nb}`:kind==="test"?`Nivåtest ${m.levels[0]}`:"Rask repetisjon";
  const hd=`<div class="lessonhd"><button class="btn link" data-a="home" aria-label="Close">✕</button><div class="progress"><i style="width:${V.phase==="done"?100:V.i/V.items.length*100}%"></i></div><span class="small muted">${label}</span></div>`;
  if(V.phase==="intro"){const les=m.les;
    return topbar()+hd+`<div class="stack" style="gap:20px"><div class="stack" style="gap:6px"><p class="eyebrow">${label}</p><h1>${esc(les.title)}</h1><p class="muted">${esc(les.en)}</p></div>
    <div class="prose tablewrap">${les.intro}</div>
    ${les.text?`<div class="passage">${esc(les.text)}</div>${playBtns(les.text)}`:""}
    <div><button class="btn" data-a="begin">Start øvelsene (${les.ex.length})</button></div></div>`}
  if(V.phase==="done"){
    const g=V.res.length,ok=V.res.filter(Boolean).length,pc=g?Math.round(ok/g*100):0;
    const pass=kind==="test"?pc>=70:null;
    let next="";
    if(kind==="lesson"){const plan=todayPlan();const nx=plan&&plan.find(t=>!(t.kind==="lesson"&&t.L===m.L&&t.sk===m.sk&&t.n===m.n));if(nx)next=`<button class="btn" data-a="taskObj" data-v='${esc(JSON.stringify(nx))}'>Next: ${esc(nx.title)}</button>`}
    return topbar()+hd+`<div class="stack" style="gap:20px;align-items:flex-start"><p class="eyebrow">${kind==="test"?(pass?"Bestått":"Ikke bestått ennå"):"Ferdig"}</p><p class="score">${pc} %</p>
    <p class="muted" style="max-width:56ch">${ok} of ${g} right. ${kind==="test"?(pass?`You passed ${m.levels[0]}! ${working()?`Next up: ${working()}.`:"You've reached your goal."}`:"You need 70 %. The plan on the home page will point you to the areas to review."):pc>=80?"Very good. This lesson is marked as strong.":"Saved. It will come back in your plan for review."}</p>
    <div class="row">${next}<button class="btn ${next?"ghost":""}" data-a="home">Back to overview</button>${kind==="lesson"?`<button class="btn link" data-a="lesson" data-v="${m.L}|${m.sk}|${m.n}">Repeat</button>`:""}</div></div>`}
  const it=V.items[V.i];
  const les=m.les;
  return topbar()+hd+`<div class="stack" style="gap:20px">${les&&les.text?`<details class="passage" ${V.i<2?"open":""}><summary>Tekst</summary>${esc(les.text)}</details>`:""}${exHTML(it)}</div>`;
}

function vSettings(){
  return topbar()+`<div class="stack" style="gap:24px"><h1>Innstillinger</h1>
  ${SB?`<div class="card stack"><h3>Account</h3>${C.uid?`<p class="small">Logged in as <b>${esc(C.name)}</b>. Your progress is saved to your account${C.status==="error"?", but the last save failed. It will retry automatically.":"."}</p><div class="row"><button class="btn ghost sm" data-a="syncNow">Sync now</button><button class="btn ghost sm" data-a="signOut">Log out</button></div>`:`<p class="small">Log in to save your progress to your account and use it on any device. Until then, it's saved in this browser only.</p><div class="row"><button class="btn sm" data-a="auth">Log in</button><button class="btn ghost sm" data-a="signup">Create account</button></div>`}</div>`:""}
  <div class="card stack"><h3>Levels</h3><p class="muted small">Starting level <b>${S.current}</b>, goal <b>${S.target}</b>. Your lesson progress is kept when you change these.</p><div class="row"><button class="btn ghost sm" data-a="welcome">Change starting level</button><button class="btn ghost sm" data-a="newGoal">Change goal</button></div></div>
  <div class="card stack"><h3>Audio speed</h3><div class="row">${[[.75,"Slow"],[.9,"Normal"],[1.05,"Natural"]].map(([r,l])=>`<button class="btn ${S.rate===r?"":"ghost"} sm" data-a="rate" data-v="${r}">${l}</button>`).join("")}<button class="btn link sm" data-a="say" data-t="Hei! Hvordan har du det i dag?">▶ Test</button></div>${voiceNote()}</div>
  <div class="card stack"><h3>Back up your progress</h3><p class="muted small">Progress is saved in this browser only. Copy this code to move it to another device or browser, then paste it there.</p>
    <textarea class="inp" id="bk" style="min-height:90px;font-size:12px" readonly>${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea>
    <div class="row"><button class="btn ghost sm" data-a="copy">Copy code</button></div>
    <textarea class="inp" id="imp" style="min-height:70px;font-size:12px" placeholder="Paste a backup code here"></textarea><div><button class="btn ghost sm" data-a="import">Restore from code</button></div></div>
  <div class="card stack"><h3>Start over</h3><p class="muted small">Deletes all progress in this browser.</p>${V.confirm?`<div class="row"><button class="btn sm" style="background:var(--bad);color:var(--surface)" data-a="reset">Yes, delete everything</button><button class="btn link sm" data-a="settings">Cancel</button></div>`:`<div><button class="btn ghost sm" data-a="askReset">Reset progress</button></div>`}</div>
  </div>`}

function render(){
  const v=V.view;
  $app.innerHTML=v==="welcome"?vWelcome():v==="target"?vTarget():v==="place"?vPlacement():v==="run"?vRun():v==="settings"?vSettings():v==="auth"?vAuth():v==="reset"?vReset():vHome();
  const f=document.getElementById("fillIn");if(f&&!f.disabled)f.focus();
  const w=document.getElementById("writeIn");if(w)updWrite();
  const n=document.getElementById("nextBtn");if(n)n.focus({preventScroll:true});
}

/* ---------- answering ---------- */
function record(ok,graded=true){V.res[V.i]=ok;V.answered=true;if(graded){S.answered++;if(ok)S.correct++}markDay();save();render()}
function finish(){
  const g=V.res.length,ok=V.res.filter(Boolean).length,pc=g?Math.round(ok/g*100):0,m=V.meta;
  if(V.kind==="lesson"){const k=lid(m.L,m.sk,m.n),p=S.lessons[k]||{best:0};S.lessons[k]={done:true,best:Math.max(p.best,pc),last:pc,at:today()};S.skillLast[m.L+m.sk]=today()}
  if(V.kind==="test"){const L=m.levels[0],p=S.tests[L]||{best:0,passed:false};S.tests[L]={best:Math.max(p.best,pc),passed:p.passed||pc>=70}}
  markDay();save();V.phase="done";render();window.scrollTo(0,0);
}
function updWrite(){
  const w=document.getElementById("writeIn");if(!w)return;const it=V.items[V.i];
  const n=(w.value.trim().match(/\S+/g)||[]).length;const wc=document.getElementById("wc");if(wc)wc.textContent=`${n} / ${it.min} words`;
  const low=w.value.toLowerCase();document.querySelectorAll("[data-hint]").forEach(c=>c.classList.toggle("on",low.includes(c.dataset.hint.toLowerCase())));
  const b=document.getElementById("wsub");if(b)b.disabled=n<Math.ceil(it.min/2);
}
function runTask(t){
  if(t.kind==="lesson")startRun("lesson",{L:t.L,sk:t.sk,n:t.n});
  else if(t.kind==="test")startRun("test",{levels:[t.L]});
  else startRun("quick",{levels:path().filter(L=>COURSE[L]&&LEVELS.indexOf(L)<=LEVELS.indexOf(t.L)),onlyDone:Object.keys(S.lessons).length>0});
}

const A={
  home(){V={view:S.target?"home":"welcome",level:V.level};if(HASTTS)speechSynthesis.cancel();render();window.scrollTo(0,0)},
  welcome(){V={view:"welcome",manual:true};render()},
  settings(){V={view:"settings",level:V.level};render()},
  pickCur(v){S.current=v;save();V={view:"target"};render()},
  newGoal(){V={view:"target",manual:true};render()},
  pickTarget(v){S.target=v;save();V={view:"home"};render();window.scrollTo(0,0)},
  placement(){V={view:"place",p:{i:0,res:[],items:PLACEMENT.map(prep)}};render()},
  pAns(v){const P=V.p,q=P.items[P.i];P.res[P.i]=+v>=0&&q.opts[+v].ok;P.i++;render()},
  level(v){V.level=v;render()},
  lesson(v){const [L,sk,n]=v.split("|");startRun("lesson",{L,sk,n:+n})},
  test(v){startRun("test",{levels:[v]})},
  quickAny(){startRun("quick",{levels:COURSE_LEVELS.filter(L=>p0(L)),onlyDone:true})},
  task(v){runTask(todayPlan()[+v])},
  taskObj(v){runTask(JSON.parse(v))},
  begin(){V.phase="ex";render();window.scrollTo(0,0)},
  say(_,b){speak(b.dataset.t,!!b.dataset.slow)},
  pick(v){const it=V.items[V.i];V.pick=+v;record(it.opts[+v].ok)},
  key(v){const f=document.getElementById("fillIn");if(!f)return;const s=f.selectionStart??f.value.length;f.value=f.value.slice(0,s)+v+f.value.slice(f.selectionEnd??s);f.focus();f.setSelectionRange(s+1,s+1)},
  checkFill(){const f=document.getElementById("fillIn");const val=f.value;if(!val.trim())return f.focus();V.typed=val;const it=V.items[V.i];record(it.a.some(a=>norm(a)===norm(val)))},
  tile(v){const it=V.items[V.i];it.picked.push(it.bank.splice(+v,1)[0]);render()},
  unpick(v){const it=V.items[V.i];it.bank.push(it.picked.splice(+v,1)[0]);render()},
  resetOrder(){const it=V.items[V.i];it.bank=shuffle(it.w.map((_,k)=>k));it.picked=[];render()},
  checkOrder(){const it=V.items[V.i];const s=norm(it.picked.map(k=>it.w[k]).join(" "));record([it.w.join(" "),...it.alt].some(a=>norm(a)===s))},
  self(v){record(v==="1",false)},
  checkWrite(){const w=document.getElementById("writeIn");const it=V.items[V.i];V.typed=w.value;const n=(w.value.trim().match(/\S+/g)||[]).length;const low=w.value.toLowerCase();const used=it.hints.filter(h=>low.includes(h.toLowerCase())).length;record(n>=it.min&&used>=Math.ceil(it.hints.length/2),false)},
  next(){V.typed="";V.pick=null;if(V.i+1<V.items.length){V.i++;V.answered=false;render();window.scrollTo(0,0)}else finish()},
  rate(v){S.rate=+v;save();render()},
  copy(){const t=document.getElementById("bk");const done=()=>toast("Copied");try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast("Selected. Press Ctrl+C or Copy.")})}catch(e){t.select();toast("Selected. Press Ctrl+C or Copy.")}},
  import(){const t=document.getElementById("imp").value.trim();if(!t)return toast("Paste a code first.");try{const d=JSON.parse(decodeURIComponent(escape(atob(t))));if(!d||typeof d!=="object"||!("lessons" in d))throw 0;S=Object.assign(fresh(),d);save();toast("Progress restored");A.home()}catch(e){toast("That code doesn't look right. Copy the whole code and try again.")}},
  askReset(){V.confirm=true;render()},
  reset(){S=fresh();save();V={view:"welcome"};render();toast("Progress deleted")},
  syncNow(){cloudWrite().then(()=>toast(C.status==="synced"?"Synced":"Couldn't sync. Try again later."))},
  auth(){V={view:"auth",mode:"signin"};render()},
  signup(){V={view:"auth",mode:"signup"};render()},
  authMode(){V={view:"auth",mode:V.mode==="signup"?"signin":"signup"};render()},
  async forgot(){const e=document.getElementById("au-email").value.trim();if(!/^\S+@\S+\.\S+$/.test(e)){V.err="Type your email above first, then click Forgot password.";return render()}const {error}=await SB.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});V.err=error?error.message:"";V.msg=error?"":"If that email has an account, a reset link is on its way.";render()},
  async signOut(){await SB.auth.signOut();C.uid=null;C.name="";S=fresh();try{localStorage.removeItem(KEY)}catch(e){}V={view:"welcome"};setCloud("signedout");render();toast("Logged out")}
};
function p0(L){return SKILLS.some(s=>lessonsOf(L,s.id).some((_,n)=>S.lessons[lid(L,s.id,n)]?.done))}

$app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v,b)});
$app.addEventListener("submit",e=>{if(e.target.id==="authForm"){e.preventDefault();authSubmit()}if(e.target.id==="resetForm"){e.preventDefault();resetSubmit()}});
$app.addEventListener("input",e=>{if(e.target.id==="writeIn")updWrite()});
$app.addEventListener("keydown",e=>{if(e.target.id==="fillIn"&&e.key==="Enter"){e.preventDefault();A.checkFill()}});
render();
cloudInit();
</script>

</body>
</html>
